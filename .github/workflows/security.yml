name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, Sundays 03:17 UTC, finished before the 06:00 Berlin
    # Dependabot window so Sunday morning shows scans and PRs together.
    - cron: "17 3 * * 0"

permissions:
  # Required by the reusable workflow to upload SARIF to code scanning.
  actions: read
  contents: read
  security-events: write

jobs:
  osv-scan:
    # Google's recommended reusable workflow. The scan step is
    # continue-on-error, so an absent lockfile does not fail the job; the run
    # fails only when an actual vulnerability is found (fail-on-vuln, default).
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
