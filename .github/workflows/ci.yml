name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Unit tests + lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Project pins jvmToolchain(21) and sourceCompatibility 21; AGP 9.0.1 runs
      # on JDK 17+. JDK 21 satisfies both the Gradle runtime and the Kotlin/Java
      # toolchain, so no toolchain auto-provisioning is needed.
      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      # Provides the Android SDK (ANDROID_HOME) and accepts licenses so AGP can
      # resolve compileSdk 35 platform + build-tools. Required: setup-gradle does
      # not supply the Android SDK.
      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Run unit tests and lint
        run: ./gradlew testDebugUnitTest lintDebug --stacktrace
