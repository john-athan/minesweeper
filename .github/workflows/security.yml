name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, Mondays 06:00 UTC
    - cron: "0 6 * * 1"

permissions:
  # Required by the reusable workflow to upload SARIF to code scanning.
  actions: read
  contents: read
  security-events: write

jobs:
  osv-scan:
    # Google's recommended reusable workflow. The scan step is
    # continue-on-error, so an absent lockfile does not fail the job; the run
    # fails only when an actual vulnerability is found (fail-on-vuln, default).
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.5.1
