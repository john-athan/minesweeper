name: Release

# There is deliberately no signing step here. No signing secrets exist for this
# repo, and F-Droid does not use an upstream signature for this app: its
# metadata has no Binaries line and no AllowedAPKSigningKeys, so F-Droid builds
# from the tag and signs with its own key. Attaching a self-signed APK would
# only create a second identity for the app. This job builds the release APK
# the way F-Droid does and prints its checksum, so a drifting build environment
# shows up here before it shows up in an F-Droid build. If upstream signing is
# ever adopted, copy the sign step from the nonius release workflow.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    name: Build the release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version-file: .java-version

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Build the release APK
        run: ./gradlew assembleRelease

      - name: Checksum of the unsigned APK
        run: sha256sum app/build/outputs/apk/release/app-release-unsigned.apk
